name: backend-macos-arm64

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "src/*"
      - "scripts/*"
      - "html/**"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "src/*"
      - "scripts/*"
      - "html/**"
  workflow_call:
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build frontend
    uses: ./.github/workflows/frontend.yml

  build:
    needs: build-frontend
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download frontend header
        uses: actions/download-artifact@v4
        with:
          name: frontend-header
          path: src/

      - name: Install dependencies
        run: |
          brew install json-c libwebsockets

      - name: Build ttyd (arm64-macos)
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Upload ttyd binary
        uses: actions/upload-artifact@v4
        with:
          name: ttyd.arm64-macos
          path: build/ttyd
